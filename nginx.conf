server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # never serve dotfiles (.git, .gitkeep, .env)
    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|json|svg|woff2|mp4|png|jpg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
